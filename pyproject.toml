# Python stays at 3.11 to match the Azure Functions runtime.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # naive datetimes, which Table Storage timestamps would silently accept
    "SIM",  # flake8-simplify
    "RUF",
]
ignore = ["E501"] # line length is the formatter's job

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system relies on calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
# The Azure SDKs ship partial stubs at best.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short", "--strict-markers"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
